<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Учебные задачи</title>
<h1>Учебные задачи</h1>
<ul>
{% for task in tasks %}
  <li>{{ task.title }} —
    {% if task.done %}выполнено{% else %}не выполнено{% endif %}
  </li>
{% empty %}
  <li>Пока задач нет</li>
{% endfor %}
</ul>
</html>
